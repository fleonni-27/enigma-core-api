services:
  - type: cron
    name: enigma-daily-analysis-report
    runtime: python
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.daily_analysis_report
    # 04:30 UTC = 01:30 America/Sao_Paulo. The runner reports the previous business date.
    schedule: "30 4 * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
