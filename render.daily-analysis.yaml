services:
  - type: cron
    name: enigma-daily-analysis-report
    runtime: python
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.daily_analysis_report
    # Temporary bootstrap cadence for operational validation. After the first
    # successful automatic run, this file is returned to 30 4 * * * and the
    # linked Blueprint auto-syncs the final daily schedule.
    schedule: "*/5 * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
