name: Rating V2 Evaluation Smoke

on:
  push:
    branches:
      - ops/rating-v2-evaluation-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit persisted snapshot evidence
        shell: bash
        run: |
          set -euo pipefail
          for fixture_id in 19453590 19453588 19453594; do
            url="https://enigma-core-api.onrender.com/audit/fixture/${fixture_id}?include_raw=true&sample_size=3"
            code=$(curl --silent --show-error --location \
              --connect-timeout 30 \
              --max-time 120 \
              --output "/tmp/audit-${fixture_id}.json" \
              --write-out '%{http_code}' \
              "$url")
            echo "FIXTURE=${fixture_id} HTTP_STATUS=${code}"
            if [ "$code" != "200" ]; then
              cat "/tmp/audit-${fixture_id}.json"
              exit 1
            fi
          done

      - name: Print compact snapshot xG audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def summarize(payload):
              snapshots = payload.get('snapshots') or []
              rows = []
              for snap in snapshots:
                  xg = snap.get('xg')
                  stats = snap.get('statistics')
                  rows.append({
                      'snapshot_id': snap.get('id') or snap.get('snapshot_id'),
                      'fetched_at': snap.get('fetched_at'),
                      'source': snap.get('source'),
                      'statistics_count': len(stats) if isinstance(stats, list) else (1 if stats else 0),
                      'xg_count': len(xg) if isinstance(xg, list) else (1 if xg else 0),
                      'xg_type_names': sorted({
                          str(((r.get('type') or {}).get('name') or (r.get('type') or {}).get('developer_name') or r.get('type_id')))
                          for r in (xg or []) if isinstance(r, dict)
                      }) if isinstance(xg, list) else [],
                      'xg_sample': (xg or [])[:2] if isinstance(xg, list) else xg,
                  })
              return {
                  'status': payload.get('status'),
                  'fixture': payload.get('fixture'),
                  'snapshot_count': len(snapshots),
                  'snapshots': rows,
              }

          result = {}
          for fixture_id in (19453590, 19453588, 19453594):
              payload = json.loads(Path(f'/tmp/audit-{fixture_id}.json').read_text())
              result[str(fixture_id)] = summarize(payload)
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          PY
