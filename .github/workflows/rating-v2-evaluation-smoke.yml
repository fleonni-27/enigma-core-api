name: Rating V2 Evaluation Smoke

on:
  push:
    branches:
      - ops/rating-v2-evaluation-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run bounded production evaluation
        shell: bash
        run: |
          set -euo pipefail
          url='https://enigma-core-api.onrender.com/research/enigma-rating-v2/evaluation-v1?start_date=2026-04-01&end_date=2026-08-24&leagues=Serie%20A&max_rows=500&include_rows=true'
          started=$(date +%s)
          http_code=$(curl --silent --show-error --location \
            --connect-timeout 30 \
            --max-time 900 \
            --output /tmp/evaluation.json \
            --write-out '%{http_code}' \
            "$url")
          elapsed=$(( $(date +%s) - started ))
          echo "HTTP_STATUS=${http_code}"
          echo "ELAPSED_SECONDS=${elapsed}"
          if [ "$http_code" != "200" ]; then
            cat /tmp/evaluation.json
            exit 1
          fi

      - name: Print xG evidence diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          p = json.loads(Path('/tmp/evaluation.json').read_text())
          rows = [r for r in (p.get('rows') or []) if r.get('partition') == 'test']
          keys = [
              'home_history_matches',
              'away_history_matches',
              'home_xg_for_history_matches',
              'home_xg_against_history_matches',
              'away_xg_for_history_matches',
              'away_xg_against_history_matches',
          ]

          distributions = {
              key: dict(sorted(Counter(int((r.get('context_audit') or {}).get(key) or 0) for r in rows).items()))
              for key in keys
          }
          full_xg_ready = [
              r for r in rows
              if all(int((r.get('context_audit') or {}).get(key) or 0) >= 3 for key in keys[2:])
          ]
          samples = []
          for r in rows[:10]:
              audit = r.get('context_audit') or {}
              samples.append({
                  'sportmonks_fixture_id': r.get('sportmonks_fixture_id'),
                  'starts_at': r.get('starts_at'),
                  'home_team': r.get('home_team'),
                  'away_team': r.get('away_team'),
                  'xg_counts': {key: audit.get(key) for key in keys[2:]},
                  'history_counts': {key: audit.get(key) for key in keys[:2]},
              })

          diagnostic = {
              'status': p.get('status'),
              'version': p.get('version'),
              'test_targets': len(rows),
              'full_xg_ready_targets': len(full_xg_ready),
              'distributions': distributions,
              'samples': samples,
          }
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2, sort_keys=True))
          PY
