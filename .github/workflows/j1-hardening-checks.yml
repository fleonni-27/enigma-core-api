name: J1 Operational Contract & Regression Checks

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "render.yaml"
      - "alembic.ini"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SPORTMONKS_API_TOKEN: "ci-test-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application, migrations and scripts
        run: python -m compileall -q app migrations scripts

      - name: Validate J1 operational contract
        run: python scripts/validate_j1_operational_contract.py

      - name: Validate Alembic migration chain
        run: alembic upgrade head

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
