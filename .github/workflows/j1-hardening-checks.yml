name: J1 Hardening Checks

on:
  pull_request:
    paths:
      - "app/daily_prediction_runner_v2.py"
      - "app/decision_engine_v2.py"
      - "app/j1_scheduler.py"
      - "app/j1_scheduler_routes.py"
      - "tests/test_j1_hardening.py"
      - ".github/workflows/j1-hardening-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Run J1 hardening unit tests
        run: python -m unittest tests.test_j1_hardening -v
