name: Enigma Rating V2 Validation Refinement V1

on:
  push:
    branches:
      - ops/evaluation-v1-xg-live-audit

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Call production one-shot validation refinement
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://enigma-core-api.onrender.com"
          params = urllib.parse.urlencode([
              ("start_date", "2026-01-01"),
              ("end_date", "2026-08-24"),
              ("leagues", "Serie A"),
              ("leagues", "Serie B"),
              ("leagues", "Copa Libertadores"),
              ("leagues", "La Liga"),
              ("max_rows", "2000"),
              ("elo_warmup_days", "1460"),
              ("poisson_home_multiplier", "1.08"),
              ("include_grid", "false"),
          ])
          url = f"{base}/research/enigma-rating-v2/tuning-v1-refinement1?{params}"
          with urllib.request.urlopen(url, timeout=300) as response:
              payload = json.load(response)

          summary = {
              "status": payload.get("status"),
              "version": payload.get("version"),
              "selection_window": payload.get("selection_window"),
              "baseline": payload.get("baseline"),
              "objective": payload.get("objective"),
              "coarse_winner_reference": payload.get("coarse_winner_reference"),
              "audit": payload.get("audit"),
              "elo_grid": (payload.get("elo") or {}).get("grid"),
              "elo_winner": (payload.get("elo") or {}).get("winner"),
              "elo_top_candidates": (payload.get("elo") or {}).get("top_candidates"),
              "dixon_coles_grid": (payload.get("dixon_coles") or {}).get("grid"),
              "dixon_coles_winner": (payload.get("dixon_coles") or {}).get("winner"),
              "dixon_coles_top_candidates": (payload.get("dixon_coles") or {}).get("top_candidates"),
              "confirmation_holdout": payload.get("confirmation_holdout"),
              "policy": payload.get("policy"),
          }
          print("ENIGMA_RATING_V2_REFINEMENT_V1=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))

          assert payload.get("status") == "ok"
          assert payload.get("version") == "enigma_rating_v2_tuning_v1_refinement1"
          assert (payload.get("selection_window") or {}).get("partition") == "validation"
          assert (payload.get("objective") or {}).get("test_partition_used_for_selection") is False
          assert ((payload.get("elo") or {}).get("grid") or {}).get("candidate_count") == 125
          assert ((payload.get("dixon_coles") or {}).get("grid") or {}).get("candidate_count") == 6
          assert (payload.get("policy") or {}).get("one_refinement_stage_only") is True
          assert (payload.get("policy") or {}).get("no_further_parameter_search_before_confirmation") is True
          holdout = payload.get("confirmation_holdout") or {}
          assert holdout.get("status") == "RESERVED_UNTOUCHED"
          assert holdout.get("start_date") == "2026-08-25"
          assert holdout.get("minimum_eligible_targets_before_confirmation") == 100
          PY
