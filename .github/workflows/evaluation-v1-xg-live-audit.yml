name: Evaluation V1 xG Live Audit

on:
  push:
    branches:
      - ops/evaluation-v1-xg-live-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Call production Evaluation V1
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://enigma-core-api.onrender.com"
          params = urllib.parse.urlencode({
              "start_date": "2026-07-01",
              "end_date": "2026-08-24",
              "leagues": "Serie A",
              "max_rows": 150,
              "include_rows": "true",
          })
          url = f"{base}/research/enigma-rating-v2/evaluation-v1?{params}"
          with urllib.request.urlopen(url, timeout=180) as response:
              payload = json.load(response)

          audit = payload.get("audit") or {}
          test = ((payload.get("evaluation") or {}).get("test") or {})
          models = test.get("models") or {}
          summary = {
              "status": payload.get("status"),
              "version": payload.get("version"),
              "audit": audit,
              "test_targets": test.get("targets"),
              "poisson_xg": models.get("POISSON_XG_XGA"),
              "dixon_coles_xg": models.get("DIXON_COLES_XG_XGA"),
              "sample_context_audit": [
                  row.get("context_audit")
                  for row in (payload.get("rows") or [])
                  if row.get("partition") == "test"
              ][:5],
          }
          print("EVALUATION_V1_XG_LIVE_AUDIT=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))

          assert payload.get("status") == "ok"
          assert audit.get("xg_chronology_version") == "evaluation_v1_xg_chronology_v1"
          assert int(audit.get("snapshots_with_nonempty_xg") or 0) > 0
          assert int(audit.get("payloads_with_full_parsed_xg") or 0) > 0
          assert int(audit.get("team_complete_xg_observations_appended") or 0) > 0
          assert int(audit.get("targets_with_any_xg_history") or 0) > 0
          PY
