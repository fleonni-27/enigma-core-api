name: Evaluation V1 Enlarged Cohort

on:
  push:
    branches:
      - ops/evaluation-v1-xg-live-audit

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Call production Evaluation V1 enlarged cohort
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://enigma-core-api.onrender.com"
          params = urllib.parse.urlencode({
              "start_date": "2026-01-01",
              "end_date": "2026-08-24",
              "leagues": "Serie A",
              "max_rows": 1000,
              "include_rows": "false",
          })
          url = f"{base}/research/enigma-rating-v2/evaluation-v1?{params}"
          with urllib.request.urlopen(url, timeout=240) as response:
              payload = json.load(response)

          evaluation = payload.get("evaluation") or {}
          validation = evaluation.get("validation") or {}
          test = evaluation.get("test") or {}
          summary = {
              "status": payload.get("status"),
              "version": payload.get("version"),
              "date_range": payload.get("date_range"),
              "parameters": payload.get("parameters"),
              "baseline": payload.get("baseline"),
              "audit": payload.get("audit"),
              "validation_targets": validation.get("targets"),
              "validation_models": validation.get("models"),
              "test_targets": test.get("targets"),
              "test_models": test.get("models"),
              "paired_vs_standard": test.get("paired_vs_standard"),
              "xg_xga_ablation": evaluation.get("test_xg_xga_ablation"),
              "form10_diagnostic": evaluation.get("test_form10_diagnostic"),
              "test_by_month": evaluation.get("test_by_month"),
          }
          print("EVALUATION_V1_ENLARGED=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))

          assert payload.get("status") == "ok"
          assert (payload.get("audit") or {}).get("elo_warmup_days") == 1460
          assert (payload.get("audit") or {}).get("loader_version") == "evaluation_v1_streaming_loader_v1"
          assert int(test.get("targets") or 0) > 0
          assert int(((test.get("models") or {}).get("STANDARD") or {}).get("sample_size") or 0) > 0
          PY
