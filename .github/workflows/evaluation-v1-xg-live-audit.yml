name: Enigma Rating V2 Frozen Manifest Audit

on:
  push:
    branches:
      - ops/evaluation-v1-xg-live-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production frozen tuning manifest
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://enigma-core-api.onrender.com/research/enigma-rating-v2/frozen-v1"
          with urllib.request.urlopen(url, timeout=120) as response:
              payload = json.load(response)

          frozen = payload.get("frozen_parameters") or {}
          elo = frozen.get("elo") or {}
          dc = frozen.get("dixon_coles") or {}
          holdout = payload.get("confirmation_holdout") or {}
          policy = payload.get("policy") or {}

          summary = {
              "status": payload.get("status"),
              "version": payload.get("version"),
              "selection_sha256": payload.get("selection_sha256"),
              "selection": payload.get("selection"),
              "frozen_parameters": frozen,
              "confirmation_holdout": holdout,
              "policy": policy,
          }
          print("ENIGMA_RATING_V2_FROZEN_MANIFEST=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))

          assert payload.get("status") == "FROZEN"
          assert payload.get("version") == "enigma_rating_v2_frozen_tuning_v1"
          assert payload.get("selection_sha256") == "3d7a37a3c81cf383f08057e6ecfa1b8cf18abe5a2a7421698fdcf31acb736dcc"
          assert elo.get("initial") == 1500.0
          assert elo.get("k_factor") == 45.0
          assert elo.get("home_advantage") == 110.0
          assert elo.get("draw_parameter") == 0.5
          assert elo.get("warmup_days") == 1460
          assert dc.get("rho") == 0.24
          assert frozen.get("poisson_home_multiplier") == 1.08
          assert holdout.get("status") == "RESERVED_UNTOUCHED"
          assert holdout.get("start_date") == "2026-08-25"
          assert holdout.get("minimum_eligible_targets") == 100
          assert holdout.get("performance_peeking_before_minimum_targets_allowed") is False
          assert holdout.get("retuning_with_holdout_data_allowed") is False
          assert policy.get("no_further_parameter_search_before_confirmation") is True
          assert policy.get("production_standard_model_unchanged") is True
          PY
