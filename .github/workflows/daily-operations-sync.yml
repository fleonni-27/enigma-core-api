name: Daily Operations Sync

on:
  workflow_dispatch:
  schedule:
    # America/Sao_Paulo is UTC-3. GitHub Actions cron has minute precision,
    # so 03:00 UTC is the midnight daily bootstrap.
    - cron: "0 3 * * *"
    # Refresh odds later in the same local day without manual fixture IDs.
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-operations-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve Sao Paulo date
        id: date
        shell: bash
        run: echo "today=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Mint Enigma OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=enigma-core-api")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Wait for operations routes
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Enigma Core operations routes to become available"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              "https://enigma-core-api.onrender.com/operations/today" \
              >/tmp/operations-today.json; then
              echo "Operations route is ready on attempt ${attempt}"
              cat /tmp/operations-today.json
              exit 0
            fi
            echo "Operations route not ready (attempt ${attempt}/12); retrying in 10s"
            sleep 10
          done
          echo "Operations route did not become ready in time"
          exit 1

      - name: Sync fixtures and prematch odds
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.today }}
          ENIGMA_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          echo "Syncing Enigma Core for ${TARGET_DATE} (America/Sao_Paulo)"
          curl --fail-with-body \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 20 \
            --retry-max-time 600 \
            --connect-timeout 30 \
            --max-time 1500 \
            -H "Authorization: Bearer ${ENIGMA_OIDC_TOKEN}" \
            -X POST \
            "https://enigma-core-api.onrender.com/operations/daily-sync?target_date=${TARGET_DATE}&refresh_odds=true" \
            -o /tmp/daily-sync.json
          cat /tmp/daily-sync.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/daily-sync.json').read_text())
          if payload.get('status') != 'ok':
              raise SystemExit(f"daily sync returned non-ok status: {payload.get('status')}")
          print('Daily Operations Sync completed with status=ok')
          PY
