name: Daily Operations Sync

on:
  workflow_dispatch:
  schedule:
    # America/Sao_Paulo is UTC-3.
    # 02:40 UTC = 23:40 previous local day: preload D+1.
    - cron: "40 2 * * *"
    # 03:00 UTC = 00:00 local: bootstrap current business day.
    - cron: "0 3 * * *"
    # 09:00 UTC = 06:00 local: morning refresh for current day.
    - cron: "0 9 * * *"
    # 15:00 UTC = 12:00 local: midday refresh for current day.
    - cron: "0 15 * * *"
    # 20:00 UTC = 17:00 local: retain late-day odds refresh.
    - cron: "0 20 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-operations-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve Sao Paulo target date
        id: date
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          local_today="$(TZ=America/Sao_Paulo date +%F)"
          if [ "${SCHEDULE:-}" = "40 2 * * *" ]; then
            target_date="$(TZ=America/Sao_Paulo date -d 'tomorrow' +%F)"
            phase="D1_PRELOAD_2340"
          elif [ "${SCHEDULE:-}" = "0 9 * * *" ]; then
            target_date="${local_today}"
            phase="DAY_REFRESH_0600"
          elif [ "${SCHEDULE:-}" = "0 15 * * *" ]; then
            target_date="${local_today}"
            phase="DAY_REFRESH_1200"
          elif [ "${SCHEDULE:-}" = "0 20 * * *" ]; then
            target_date="${local_today}"
            phase="DAY_REFRESH_1700"
          elif [ "${SCHEDULE:-}" = "0 3 * * *" ]; then
            target_date="${local_today}"
            phase="DAY_BOOTSTRAP_0000"
          else
            target_date="${local_today}"
            phase="MANUAL_CURRENT_DAY"
          fi
          echo "target_date=${target_date}" >> "$GITHUB_OUTPUT"
          echo "phase=${phase}" >> "$GITHUB_OUTPUT"
          echo "Resolved phase=${phase} target_date=${target_date}"

      - name: Mint Enigma OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=enigma-core-api")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Wait for operations routes
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Enigma Core operations routes to become available"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              "https://enigma-core-api.onrender.com/operations/today" \
              >/tmp/operations-today.json; then
              echo "Operations route is ready on attempt ${attempt}"
              exit 0
            fi
            echo "Operations route not ready (attempt ${attempt}/12); retrying in 10s"
            sleep 10
          done
          echo "Operations route did not become ready in time"
          exit 1

      - name: Sync fixtures and prematch odds
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          PHASE: ${{ steps.date.outputs.phase }}
          ENIGMA_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          echo "Syncing Enigma Core phase=${PHASE} target_date=${TARGET_DATE} (America/Sao_Paulo)"
          curl --fail-with-body \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 20 \
            --retry-max-time 600 \
            --connect-timeout 30 \
            --max-time 1500 \
            -H "Authorization: Bearer ${ENIGMA_OIDC_TOKEN}" \
            -X POST \
            "https://enigma-core-api.onrender.com/operations/daily-sync?target_date=${TARGET_DATE}&refresh_odds=true" \
            -o /tmp/daily-sync.json
          cat /tmp/daily-sync.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/daily-sync.json').read_text())
          if payload.get('status') != 'ok':
              raise SystemExit(f"daily sync returned non-ok status: {payload.get('status')}")
          expected = os.environ['TARGET_DATE']
          actual = payload.get('target_date')
          if actual != expected:
              raise SystemExit(f"daily sync target mismatch: expected={expected} actual={actual}")
          print(
              'Daily Operations Sync completed',
              f"phase={os.environ['PHASE']}",
              f"target_date={actual}",
              f"target_fixtures={(payload.get('target_fixtures') or {}).get('count')}",
          )
          PY
