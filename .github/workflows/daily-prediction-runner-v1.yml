name: Daily Prediction Runner V1

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions is the HTTP fallback; Render cron is the primary scheduler.
    # J1 target remains kickoff - 45 minutes and the backend never executes early.
    # America/Sao_Paulo is UTC-3. These windows cover 07:00-23:59 local time.
    - cron: "*/10 10-23 * * *"
    - cron: "*/10 0-2 * * *"

concurrency:
  group: daily-prediction-runner-v1
  cancel-in-progress: false

jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for J1 routes
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Enigma Core J1 routes to become available"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              "https://enigma-core-api.onrender.com/operations/daily-prediction-runner/status" \
              >/tmp/j1-status.json; then
              echo "J1 route is ready on attempt ${attempt}"
              cat /tmp/j1-status.json
              exit 0
            fi
            echo "J1 route not ready (attempt ${attempt}/12); retrying in 10s"
            sleep 10
          done
          echo "J1 route did not become ready in time"
          exit 1

      - name: Run J1 prediction and decision pipeline
        shell: bash
        run: |
          set -euo pipefail
          echo "Running Enigma Core J1 pipeline (target: kickoff - 45m)"
          curl --fail-with-body \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 20 \
            --retry-max-time 600 \
            --connect-timeout 30 \
            --max-time 2400 \
            -X POST \
            "https://enigma-core-api.onrender.com/operations/daily-prediction-runner?max_lateness_minutes=20&max_fixtures=5" \
            -o /tmp/j1-run.json
          cat /tmp/j1-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/j1-run.json').read_text())
          if payload.get('status') != 'ok':
              raise SystemExit(f"daily prediction runner returned non-ok status: {payload.get('status')}")

          health = (payload.get('run_health') or {}).get('status')
          reasons = (payload.get('run_health') or {}).get('reason_codes') or []
          print(f"J1 run health={health}; reasons={reasons}")
          if health == 'FAILED':
              raise SystemExit(f"J1 pipeline failed internally: {reasons}")
          if health in {'DEGRADED', 'REVIEW'}:
              print(f"::warning::J1 pipeline health={health}: {reasons}")
          print('Daily Prediction Runner completed without fatal runner health')
          PY
