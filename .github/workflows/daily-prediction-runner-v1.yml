name: Daily Prediction Runner V1

on:
  workflow_dispatch:
  schedule:
    # J1 target is kickoff - 45 minutes. The runner never executes early;
    # it handles the first scheduler tick after J1 becomes due.
    # America/Sao_Paulo is UTC-3. These windows cover 07:00-23:59 local time.
    - cron: "*/15 10-23 * * *"
    - cron: "*/15 0-2 * * *"

jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run J1 prediction and decision pipeline
        shell: bash
        run: |
          set -euo pipefail
          echo "Running Enigma Core Daily Prediction Runner V1 (J1 target: kickoff - 45m)"
          curl --fail-with-body \
            --retry 2 \
            --retry-delay 20 \
            --connect-timeout 30 \
            --max-time 2400 \
            -X POST \
            "https://enigma-core-api.onrender.com/operations/daily-prediction-runner?max_lateness_minutes=20&max_fixtures=5"
