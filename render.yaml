services:
  - type: web
    name: enigma-core-api
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_v017:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football

  - type: cron
    name: enigma-j1-runner
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.j1_scheduler_v2
    # Primary J1 scheduler. Selector V2 excludes already-recorded fixture/window
    # pairs before applying the per-cycle fixture cap. The backend still enforces
    # kickoff-45m and never runs early.
    # Minute cadence means a newly opened J1 is normally picked up within ~1 minute.
    schedule: "* * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
