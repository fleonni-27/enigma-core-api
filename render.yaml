services:
  - type: web
    name: enigma-core-api
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_v015:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
