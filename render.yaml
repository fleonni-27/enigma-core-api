services:
  - type: web
    name: enigma-core-api
    runtime: python
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db_release
    startCommand: uvicorn app.main_v017:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football

  - type: cron
    name: enigma-j1-runner
    runtime: python
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.j1_scheduler
    schedule: "* * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: J1_MAX_FIXTURES
        value: "20"
      - key: J1_EXECUTION_MODE
        value: batch

  - type: worker
    name: enigma-j1-worker
    runtime: python
    region: virginia
    branch: main
    autoDeploy: true
    plan: starter
    numInstances: 3
    maxShutdownDelaySeconds: 300
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.j1_claim_worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: J1_MAX_FIXTURES
        value: "20"
      - key: J1_WORKER_POLL_SECONDS
        value: "0.5"
      - key: J1_WORKER_LEASE_SECONDS
        value: "180"
      - key: J1_WORKER_RETRY_DELAY_SECONDS
        value: "15"
      - key: J1_WORKER_MAX_ATTEMPTS
        value: "5"

  - type: cron
    name: enigma-dashboard-enrichment
    runtime: python
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.dashboard_enrichment_runner
    schedule: "*/15 * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football

  - type: cron
    name: enigma-daily-analysis-report
    runtime: python
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.daily_analysis_report
    schedule: "30 4 * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: DATABASE_URL
      - key: SPORTMONKS_API_TOKEN
        fromService:
          type: web
          name: enigma-core-api
          envVarKey: SPORTMONKS_API_TOKEN
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
